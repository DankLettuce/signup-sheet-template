# GENERATED by scripts/configure.mjs. Optional companion Worker: daily JSON snapshot of the sign-up data
# into the `snapshots` table. Uses the SAME D1 database as the Pages project.
name = "example-class-signup-backup"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false   # no public URL; cron only

[triggers]
crons = ["0 9 * * *"]  # once a day, 09:00 UTC

[[d1_databases]]
binding = "DB"
database_name = "example-class-signup"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
STOP_AFTER = "2026-11-20"  # stop snapshotting after this date (about 3 weeks after the event)
